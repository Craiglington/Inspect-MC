<header>
  <mat-toolbar>
    <button mat-icon-button matTooltip="Menu" [matMenuTriggerFor]="menu">
      <mat-icon>menu</mat-icon>
    </button>
    <mat-menu #menu="matMenu">
      <button mat-menu-item (click)="contactUs()">Contact Me</button>
    </mat-menu>
    <button mat-icon-button matTooltip="Map">
      <mat-icon>map</mat-icon>
    </button>
    <span class="spacer"></span>
    <app-toggle-theme></app-toggle-theme>
  </mat-toolbar>
</header>
