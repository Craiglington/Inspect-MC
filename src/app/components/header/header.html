<header>
  <mat-toolbar>
    <div id="logo" class="app-logo"></div>
    <span>{{ title }}</span>
    <span class="spacer"></span>

    <a
      mat-icon-button
      matTooltip="World Info"
      routerLink="/world-info"
      [ngClass]="{ 'current-route': route === '/world-info' }">
      <mat-icon>info</mat-icon>
    </a>

    <a
      mat-icon-button
      matTooltip="Map"
      routerLink="/map"
      [ngClass]="{ 'current-route': route === '/map' }">
      <mat-icon>map</mat-icon>
    </a>

    <a
      mat-icon-button
      matTooltip="Player Data"
      routerLink="/player-data"
      [ngClass]="{ 'current-route': route === '/player-data' }">
      <mat-icon>people</mat-icon>
    </a>

    <a
      mat-icon-button
      matTooltip="Stats"
      routerLink="/stats"
      [ngClass]="{ 'current-route': route === '/stats' }">
      <mat-icon>leaderboard</mat-icon>
    </a>

    <div class="button-spacer"></div>

    <button
      mat-icon-button
      (click)="openUploadDialog()"
      matTooltip="Upload World Folder">
      <mat-icon>upload</mat-icon>
    </button>
    <app-toggle-theme></app-toggle-theme>
    <button mat-icon-button (click)="openHelpDialog()" matTooltip="Help">
      <mat-icon>help</mat-icon>
    </button>
  </mat-toolbar>
</header>
