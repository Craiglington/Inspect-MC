<h2 id="dialogTitle" mat-dialog-title>World Info Settings</h2>
<mat-dialog-content id="dialogContent" [formGroup]="formGroup">
  <mat-form-field subscriptSizing="dynamic">
    <mat-label>World Info Category</mat-label>
    <mat-select formControlName="worldInfoCategory">
      @for (worldInfoCategory of worldInfoOptions; track $index) {
        <mat-option [value]="worldInfoCategory.value">{{
          worldInfoCategory.text
        }}</mat-option>
      }
    </mat-select>
  </mat-form-field>
  <p>
    <em>*Only available starting with version 26.1.</em>
  </p>
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton="outlined" mat-dialog-close>Cancel</button>
  <button
    matButton="filled"
    [mat-dialog-close]="getOutputData()"
    [disabled]="formGroup.invalid || !formGroup.dirty">
    Save
  </button>
</mat-dialog-actions>
