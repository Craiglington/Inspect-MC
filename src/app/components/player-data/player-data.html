@if (loading) {
  <app-spinner></app-spinner>
}

<button
  id="editButton"
  matIconButton
  type="button"
  matTooltip="Player Data Settings"
  (click)="openPlayerDataDialog()">
  <mat-icon>settings</mat-icon>
</button>

@if (activePlayerData) {
  <app-snbt-object-viewer
    id="snbt-viewer"
    [data]="activePlayerData"
    [startingOpenIndices]="[0]"></app-snbt-object-viewer>
} @else {
  <app-no-data></app-no-data>
}
