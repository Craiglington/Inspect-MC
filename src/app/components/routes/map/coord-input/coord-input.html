<div id="input-container" [ngClass]="{ disabled: disabled }">
  <span id="label">{{ label }}</span>
  <input
    [id]="name"
    [name]="name"
    [ngModel]="value"
    (ngModelChange)="valueChanged($event)"
    [disabled]="disabled"
    type="number"
    [placeholder]="placeholder"
    [step]="step"
    [min]="min"
    [max]="max"
    aria-labelledby="label" />
</div>
