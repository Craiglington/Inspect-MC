@if (regionFilesProcessed) {
<form id="mapForm" class="flex-row">
  <app-coord-input
    label="X:"
    name="xCoord"
    [(ngModel)]="xCoord"
    (change)="coordInputChange()"></app-coord-input>
  <app-coord-input
    label="Z:"
    name="zCoord"
    [(ngModel)]="zCoord"
    (change)="coordInputChange()"></app-coord-input>
  <app-coord-input
    label="Y:"
    name="yLevel"
    [(ngModel)]="yLevel"
    [min]="-64"
    [max]="319"
    (change)="yLevelChange()"></app-coord-input>
</form>
}

<button
  id="editButton"
  matIconButton
  type="button"
  (click)="openMapDialog()"
  matTooltip="Map Settings">
  <mat-icon>settings</mat-icon>
</button>

<canvas
  #mapCanvas
  id="map-canvas"
  [ngClass]="{'draggingMap': draggingMap}"
  (mousedown)="mouseDown($event)"
  (mousemove)="mouseMove($event)">
</canvas>
