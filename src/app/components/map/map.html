@if (regionFilesProcessed) {
<form id="mapForm" class="flex-row">
  <app-coord-input
    label="X:"
    name="mapXCoord"
    [(ngModel)]="mapCoords.x"
    (change)="mapCoordInputChange()"></app-coord-input>
  <app-coord-input
    label="Z:"
    name="mapZCoord"
    [(ngModel)]="mapCoords.z"
    (change)="mapCoordInputChange()"></app-coord-input>
  <app-coord-input
    label="Y:"
    name="mapYLevel"
    [(ngModel)]="mapYLevel"
    [min]="-64"
    [max]="319"
    (change)="mapYLevelChange()"></app-coord-input>
</form>
}

<button
  id="editButton"
  matIconButton
  type="button"
  (click)="openMapDialog()"
  matTooltip="Map Settings">
  <mat-icon>settings</mat-icon>
</button>

<canvas
  #map
  id="map"
  [ngClass]="{'isMapDragging': isMapDragging}"
  (mousedown)="mouseDown($event)"
  (mousemove)="mouseMove($event)">
</canvas>
