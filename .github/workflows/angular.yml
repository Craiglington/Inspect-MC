name: Angular

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: SPA fallback (404.html)
        run: cp dist/inspect-mc/browser/index.html dist/inspect-mc/browser/404.html

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/inspect-mc/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - uses: actions/deploy-pages@v4
